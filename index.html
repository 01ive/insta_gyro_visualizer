<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Three.js 101</title>
  <!--  Simple reset to delete the margins  -->
  <style>
    body {
      margin: 0;
    }

    canvas {
      width: 100%;
      height: 100%
    }

    #time {
      width: 90%
    }
  </style>
  <!--  Three.js CDN  -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="menu_button">
    <label id="my-file-selector" for="file-selector"></label>
    <input type="file" id="file-selector" accept=".json">
  </div>
  <div id="value">---- / ----</div>
  <div>
    <input type="range" id="time" name="time" min="0" max="1000" />
    <label for="time">Time</label>
  </div>
  <div>
    <input type="button" id="reset" value="Reset" onclick="reset_position()"/>
  </div>
  <!--  Our code  -->
  <script type="module" src="view.js"></script>
  <script>
    var sensor_data = [];
    var reset_offset = {x: 0, y: 0, z: 0};

    // Load file button
    const fileSelector = document.getElementById('file-selector');
    let current_file;
    fileSelector.addEventListener('change', (event) => {
      const fileList = event.target.files;
      const reader = new FileReader();
      reader.addEventListener('load', (event) => {
        current_file = event.target.result;
        read_file(current_file);
      });
      reader.readAsText(fileList[0]);
    });

    function reset_position() {
      let index = document.getElementById('time').valueAsNumber;
      reset_offset = {x: sensor_data[index]['Rotation X'], y: sensor_data[index]['Rotation Y'], z: sensor_data[index]['Rotation Z']};
    }

    function read_file(file) {
      sensor_data = JSON.parse(file);
      document.getElementById('time').max = sensor_data.length.toString();
    }    
  </script>
</body>

</html>
