<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Paragliding animations</title>
    <!-- STYLE -->
    <style>
        body {
            margin: 0;
        }

        canvas {
            width: 100%;
            height: 100%
        }

        #time {
            width: 90%
        }
    </style>
    <!-- IMPORT JS -->
    <script src="https://cdn.jsdelivr.net/npm/three@latest/build/three.min.js"></script>
    <script src="3D_models/cam_and_axes.js"></script>
    <script src="demo.js"></script>
</head>

<!-- HTML BODY -->

<body>
    <div id="menu_button">
        <label id="my-file-selector" for="file-selector"></label>
        <input type="file" id="file-selector" accept=".json">
    </div>
    <div id="value">---- / ----</div>
    <div>
        <input type="range" id="time" name="time" min="0" max="1000" value="0" />
        <label for="time">Time</label>
    </div>
    <div>
        <input type="button" id="reset" value="Reset position" onclick="reset_position()" />
        <input type="button" id="demo" value="Demo" onclick="demo()" />
        <input type="button" id="play" value="Play" onclick="play()" />
        <input type="button" id="play_speed" value="1x" onclick="speed()" />
    </div>

    <!-- JAVASCRIPT -->
    <script>
        var sensor_data = [{
                            "Time":0.0,
                            "w":0.1,
                            "x":0.0,
                            "y":0.0,
                            "z":0.0
                        }];

        var index = 0;
        var reset_quaternion = new THREE.Quaternion().identity();
        var sensor_quaternion = new THREE.Quaternion().identity();

        // Action on reset button
        function reset_position() {
            index = document.getElementById('time').valueAsNumber;
            reset_quaternion.copy(sensor_quaternion)
            reset_quaternion.invert();
        }

        // Play button management
        const play_period_s = 0.050; // s
        var play_speed = 1;
        var auto_play_timer = 0;
        var play_index = 0;
        var play_time = 0;

        function speed() {
            play_speed *= 2;
            if (play_speed > 16) {
                play_speed = 1;
            }
            document.getElementById('play_speed').value = play_speed.toString() + "x";
        }

        function play_period() {
            if (play_index < sensor_data.length - 1) {
                play_time += play_period_s * play_speed;
                while (sensor_data[play_index]['Time'] < play_time) {
                    play_index++;
                    if (play_index >= sensor_data.length - 1) {
                        break;
                    }
                }
                document.getElementById('time').valueAsNumber = play_index;
            }
        }

        function play() {
            if (auto_play_timer != 0) {
                clearInterval(auto_play_timer);
                document.getElementById('play').value = 'Play';
                auto_play_timer = 0;
            } else {
                play_index = index;
                play_time = sensor_data[play_index]['Time'];
                auto_play_timer = setInterval(play_period, play_period_s * 1000);
                document.getElementById('play').value = 'Pause';
            }
        }

        // Load file button
        function read_file(file) {
            sensor_data = JSON.parse(file);
            document.getElementById('time').max = (sensor_data.length - 1).toString();
        }

        const fileSelector = document.getElementById('file-selector');
        let current_file;
        fileSelector.addEventListener('change', (event) => {
            const fileList = event.target.files;
            const reader = new FileReader();
            reader.addEventListener('load', (event) => {
                current_file = event.target.result;
                read_file(current_file);
            });
            reader.readAsText(fileList[0]);
        });

        // Demo button
        function demo() {
            sensor_data = demo_data;
            document.getElementById('time').max = (sensor_data.length - 1).toString();
        }

        // ------------------------------------------------
        // ThreeJS
        // ------------------------------------------------
        // Create an empty scene
        var scene = new THREE.Scene();

        // Camera settings
        var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = -5;
        camera.rotation.x = Math.PI / 2;
        camera.rotation.z = -Math.PI / 2;

        // Create a renderer with Antialiasing
        var renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setClearColor("#000000");
        renderer.setSize(window.innerWidth, window.innerHeight);
        three_area = document.body.appendChild(renderer.domElement);

        // Create objects
        const loader = new THREE.ObjectLoader();

        var cube;
        cube = loader.parse(model_data);
        scene.add(cube);

        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        // Manage mouse events
        // Variables pour gérer le mouvement de la caméra
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        // Écouteurs pour les événements de souris
        three_area.addEventListener('mousedown', (event) => {
            isDragging = true;
        });

        three_area.addEventListener('mouseup', (event) => {
            isDragging = false;
            reset_quaternion.copy(sensor_quaternion);
            reset_quaternion.invert();
            reset_quaternion.multiply(cube.quaternion);
        });

        const axis_x = new THREE.Vector3(1, 0, 0); // Rotate around the X-axis
        const axis_y = new THREE.Vector3(0, 1, 0); // Rotate around the Y-axis
        const axis_z = new THREE.Vector3(0, 0, 1); // Rotate around the Z-axis
        const angle = Math.PI / 180; // Rotation angle in radians (1 degree per frame)
        const quaternion_rotation_positive_x = new THREE.Quaternion().setFromAxisAngle(axis_x, angle);
        const quaternion_rotation_negative_x = new THREE.Quaternion().setFromAxisAngle(axis_x, -angle);
        const quaternion_rotation_positive_y = new THREE.Quaternion().setFromAxisAngle(axis_y, angle);
        const quaternion_rotation_negative_y = new THREE.Quaternion().setFromAxisAngle(axis_y, -angle);
        const quaternion_rotation_positive_z = new THREE.Quaternion().setFromAxisAngle(axis_z, angle);
        const quaternion_rotation_negative_z = new THREE.Quaternion().setFromAxisAngle(axis_z, -angle);

        three_area.addEventListener('mousemove', (event) => {
            if (isDragging) {
                const deltaMove = {
                    x: event.clientX - previousMousePosition.x,
                    y: event.clientY - previousMousePosition.y,
                };

                if (!event.shiftKey) {
                    if (deltaMove.x > 0) {
                        cube.quaternion.multiply(quaternion_rotation_positive_x);
                    } else if (deltaMove.x < 0) {
                        cube.quaternion.multiply(quaternion_rotation_negative_x);
                    }
                }

                if (!event.ctrlKey) {
                    if (deltaMove.y > 0) {
                        cube.quaternion.multiply(quaternion_rotation_negative_z);
                    } else if (deltaMove.y < 0) {
                        cube.quaternion.multiply(quaternion_rotation_positive_z);
                    }
                }
                update_position();
            }

            previousMousePosition = {
                x: event.clientX,
                y: event.clientY,
            };
        });

        // Function to convert seconds to hours
        function seconds_to_time(s) {
            const hours = Math.floor(s / 3600);
            const minutes = Math.floor((s % 3600) / 60);
            const seconds = (s % 60).toFixed(2);
            return `${hours}:${minutes}:${seconds}`;
        }

        function update_position() {
            let lacet = cube.quaternion.angleTo(new THREE.Quaternion(0, 0, 0, 1)) * 180 / Math.PI;
            let assiette = cube.quaternion.angleTo(new THREE.Quaternion(0, 0, 1, 0)) * 180 / Math.PI;
            let roulis = cube.quaternion.angleTo(new THREE.Quaternion(0, 1, 0, 0)) * 180 / Math.PI;

            // Print debug text
            value.innerHTML = index.toString() + " / " + sensor_data.length.toString() +
                " | time: " + seconds_to_time(sensor_data[index]['Time']) +
                " | assiette: " + assiette.toFixed(0).toString() + "°" +
                " | roulis: " + roulis.toFixed(0).toString() + "°" +
                " | lacet: " + lacet.toFixed(0).toString() + "°";
        }

        // Render Loop
        function render() {
            requestAnimationFrame(render);

            if ((sensor_data.length > 0) && (isDragging == false)) {
                // Get cursor position
                index = document.getElementById('time').valueAsNumber;

                // Update object position
                sensor_quaternion.fromArray([sensor_data[index]['x'], sensor_data[index]['y'], sensor_data[index]['z'], sensor_data[index]['w']]);
                cube.quaternion.multiplyQuaternions(sensor_quaternion, reset_quaternion);

                update_position();
            }

            // Render the scene
            renderer.render(scene, camera);
        };

        render();
    </script>
</body>

</html>
